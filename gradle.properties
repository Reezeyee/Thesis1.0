# JDK 24 (class file v68): use Gradle 8.14+ so the daemon can run on Java 24, or set Gradle JDK to 17/21 in Android Studio.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Matches compileSdk 35 with AGP 8.8+; avoids noisy warnings.
android.suppressUnsupportedCompileSdk=35
